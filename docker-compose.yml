version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logistai
    ports:
      - "5432:5432"
    volumes:
      - logistai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/logistai
      JWT_SECRET: change_this_to_a_long_random_string
      ALLOWED_ORIGINS: http://localhost:3000
      UPLOAD_DIR: uploads
      BOOTSTRAP_ADMIN_PHONE: "+998900000000"
      BOOTSTRAP_ADMIN_PASSWORD: admin12345
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - logistai_uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  logistai_pgdata:
  logistai_uploads:
